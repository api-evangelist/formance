aid: formance
url: https://raw.githubusercontent.com/api-evangelist/formance/refs/heads/main/apis.yml
name: Formance
kind: company
description: Formance builds open-source financial infrastructure for money movement.
  The platform pairs a programmable double-entry Ledger (with the Numscript DSL) with
  a unified Payments connectivity layer and Flows orchestration, plus Wallets, Reconciliation,
  Auth, and Webhooks. It is delivered as open-source components and as a managed multi-tenant
  Formance Cloud, exposing REST APIs secured with OAuth2 client-credentials Bearer tokens.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Financial Infrastructure
- Ledger
- Double-Entry Accounting
- Payments
- Orchestration
- Money Movement
- Open Source
- Fintech
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
