  description: The programmable, open-source double-entry Ledger (v2). Create ledgers,
    post immutable transactions with multi-posting sources and destinations, read
    accounts, balances, aggregated balances and volumes, attach metadata, revert
    transactions, and model complex money flows with the Numscript DSL. Supports bulk
    requests and a full transaction/account log.
