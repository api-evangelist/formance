  description: Unified Payments connectivity layer. Install and configure connectors
    to payment processors and banks (Stripe, Wise, Mangopay, Adyen, and more), ingest
    payments and accounts, manage bank accounts, initiate and manage transfers /
    payment initiations, and group accounts into pools with aggregated balances.
    Available as v1 and the expanded v3 API surface.
